<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Pelatihan Kelas Bisa</title>
    <style>
        :root { 
            --primary: #008080; 
            --accent: #20b2aa; 
            --bg: #f8fcfc;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #e0f7f7, #ffffff); 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card { 
            background: var(--glass);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; font-size: 1.4rem; }
        .subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 25px; display: block; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; font-weight: 600; }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #d1dbdb; border-radius: 10px; 
            box-sizing: border-box; transition: 0.3s; background: white;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        .btn-loc { background: #f0f0f0; border: none; padding: 5px 10px; font-size: 0.7rem; border-radius: 5px; cursor: pointer; color: var(--primary); margin-top: 5px; }
        
        button[type="submit"] { 
            width: 100%; padding: 15px; background: var(--primary); color: white; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; 
            margin-top: 20px; transition: 0.3s;
        }
        button[type="submit"]:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Selamat Datang di Website Presensi Kegiatan Kepelatihan Kelas Bisa</h2>
        <small class="subtitle">(Operated by Briska Corp)</small>
        
        <form id="absenForm">
            <div class="form-group">
                <label>Kode Pelatihan</label>
                <select id="kode" required onchange="loadNames()"><option value="">Memuat Kode Pelatihan...</option></select>
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <select id="nama" required><option value="">Pilih Kode Terlebih Dahulu</option></select>
            </div>
            <div class="form-group">
                <label>Tanggal Presensi</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="form-group"><input type="text" id="instansi" placeholder="Asal Instansi / Sekolah / Kampus" required></div>
            <div class="form-group"><input type="text" id="bidang" placeholder="Bidang Kerja / Kelas / Jurusan Kuliah" required></div>
            <div class="form-group"><input type="text" id="nim" placeholder="NIK / NISN / NIM" required></div>
            <div class="form-group">
                <input type="text" id="daerah" placeholder="Asal Daerah (Kab/Kota - Provinsi)" required>
                <button type="button" class="btn-loc" onclick="detectLocation()">📍 Deteksi Lokasi Otomatis</button>
            </div>
            
            <button type="submit">Submit Presensi</button>
        </form>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzAzu3MmcADGsvgCai9Az4cnZCiMvHi_N1RFvx9D_odGffqmXQPcNptTLFmfl8yZsRx/exec";

        // Auto-set tanggal hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // Load Kode Pelatihan otomatis dari Spreadsheet 1 (Nama Sheet)
        async function loadCodes() {
            try {
                const res = await fetch(`${GAS_URL}?cmd=getCodes`);
                const codes = await res.json();
                const select = document.getElementById('kode');
                select.innerHTML = '<option value="">Pilih Kode Pelatihan</option>';
                codes.forEach(c => { 
                    if(c.trim()) select.innerHTML += `<option value="${c}">${c}</option>`; 
                });
            } catch (err) {
                document.getElementById('kode').innerHTML = '<option value="">Gagal memuat kode</option>';
            }
        }

        loadCodes();

        // Load Nama Lengkap berdasarkan Sheet/Kode yang dipilih
        async function loadNames() {
            const code = document.getElementById('kode').value;
            const select = document.getElementById('nama');
            if (!code) {
                select.innerHTML = '<option value="">Pilih Kode Terlebih Dahulu</option>';
                return;
            }
            select.innerHTML = '<option>Loading nama...</option>';
            try {
                const res = await fetch(`${GAS_URL}?cmd=getNames&code=${code}`);
                const names = await res.json();
                select.innerHTML = '<option value="">Pilih Nama Lengkap</option>';
                names.forEach(n => select.innerHTML += `<option value="${n}">${n}</option>`);
            } catch (err) {
                select.innerHTML = '<option value="">Gagal memuat nama</option>';
            }
        }

        // Fungsi Deteksi Lokasi
        function detectLocation() {
            const input = document.getElementById('daerah');
            input.value = "Mendeteksi...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                        const data = await res.json();
                        const city = data.address.city || data.address.town || data.address.county || '';
                        const state = data.address.state || '';
                        input.value = `${city} - ${state}`.trim();
                    } catch { input.value = "Gagal mendapatkan nama daerah"; }
                }, () => { input.value = "Izin lokasi ditolak"; });
            } else { alert("Browser tidak mendukung geolokasi"); }
        }

        // Submit Form Presensi
        document.getElementById('absenForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "Mengirim...";
            btn.disabled = true;
            
            const data = {
                kode: document.getElementById('kode').value,
                nama: document.getElementById('nama').value,
                tanggal: document.getElementById('tanggal').value,
                instansi: document.getElementById('instansi').value,
                bidang: document.getElementById('bidang').value,
                nim: document.getElementById('nim').value,
                daerah: document.getElementById('daerah').value
            };
            
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
                alert("Presensi berhasil dicatat!");
                document.getElementById('absenForm').reset();
                document.getElementById('tanggal').valueAsDate = new Date();
                loadCodes();
                document.getElementById('nama').innerHTML = '<option value="">Pilih Kode Terlebih Dahulu</option>';
            } catch (err) {
                alert("Terjadi kesalahan saat mengirim presensi.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
