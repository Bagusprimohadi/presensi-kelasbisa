<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Pelatihan</title>
    <style>
        :root { 
            --primary: #008080; 
            --accent: #20b2aa; 
            --bg: #f8fcfc;
            --glass: rgba(255, 255, 255, 0.8);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #e0f7f7, #ffffff); 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card { 
            background: var(--glass);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        
        /* Input Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: #555; margin-bottom: 5px; font-weight: 600; }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #d1dbdb; border-radius: 10px; 
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 8px rgba(0,128,128,0.2); }
        
        /* Date Picker Styling */
        input[type="date"] { cursor: pointer; color: #333; }

        button { 
            width: 100%; padding: 15px; background: var(--primary); color: white; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; 
            margin-top: 20px; transition: 0.3s;
        }
        button:hover { background: var(--accent); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Presensi Pelatihan</h2>
        <form id="absenForm">
            <div class="form-group">
                <label>Kode Pelatihan</label>
                <select id="kode" required onchange="loadNames()"><option value="">Pilih Kode</option></select>
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <select id="nama" required><option value="">Pilih Nama</option></select>
            </div>
            <div class="form-group">
                <label>Tanggal Presensi</label>
                <input type="date" id="tanggal" required>
            </div>
            <!-- Data pendukung lainnya -->
            <div class="form-group"><input type="text" id="instansi" placeholder="Asal Instansi/Sekolah" required></div>
            <div class="form-group"><input type="text" id="bidang" placeholder="Bidang/Kelas/Jurusan" required></div>
            <div class="form-group"><input type="text" id="nim" placeholder="NIK/NISN/NIM" required></div>
            <div class="form-group"><input type="text" id="daerah" placeholder="Asal Daerah (Kab/Kota)" required></div>
            
            <button type="submit">Submit Presensi</button>
        </form>
    </div>

    <script>
        const GAS_URL = "GANTI_DENGAN_URL_DEPLOY_APPS_SCRIPT_ANDA";

        // Fetch event list
        fetch('event_list.txt')
            .then(res => res.text())
            .then(text => {
                const codes = text.split('\n');
                const select = document.getElementById('kode');
                codes.forEach(c => { if(c.trim()) select.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`; });
            });

        async function loadNames() {
            const code = document.getElementById('kode').value;
            const select = document.getElementById('nama');
            select.innerHTML = '<option>Loading...</option>';
            const res = await fetch(`${GAS_URL}?cmd=getNames&code=${code}`);
            const names = await res.json();
            select.innerHTML = '<option value="">Pilih Nama</option>';
            names.forEach(n => select.innerHTML += `<option value="${n}">${n}</option>`);
        }

        document.getElementById('absenForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Mengirim...";
            
            const data = {
                kode: document.getElementById('kode').value,
                nama: document.getElementById('nama').value,
                tanggal: document.getElementById('tanggal').value,
                instansi: document.getElementById('instansi').value,
                bidang: document.getElementById('bidang').value,
                nim: document.getElementById('nim').value,
                daerah: document.getElementById('daerah').value
            };
            
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Presensi berhasil dicatat!");
            btn.innerText = "Submit Presensi";
        };
    </script>
</body>
</html>
