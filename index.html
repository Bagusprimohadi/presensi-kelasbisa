<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Pelatihan</title>
    <style>
        :root { 
            --primary: #008080; 
            --accent: #20b2aa; 
            --bg: #f8fcfc;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #e0f7f7, #ffffff); 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card { 
            background: var(--glass);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; font-size: 1.5rem; }
        .subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 25px; display: block; }
        
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; font-weight: 600; }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #d1dbdb; border-radius: 10px; 
            box-sizing: border-box; transition: 0.3s;
        }
        .btn-loc { background: #f0f0f0; border: none; padding: 5px 10px; font-size: 0.7rem; border-radius: 5px; cursor: pointer; color: var(--primary); margin-top: 5px; }
        
        button[type="submit"] { 
            width: 100%; padding: 15px; background: var(--primary); color: white; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Selamat Datang di Website Presensi Kegiatan Kepelatihan Kelas Bisa</h2>
        <small class="subtitle">(Operated by Briska Corp)</small>
        
        <form id="absenForm">
            <div class="form-group">
                <label>Kode Pelatihan</label>
                <select id="kode" required onchange="loadNames()"><option value="">Pilih Kode</option></select>
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <select id="nama" required><option value="">Pilih Nama</option></select>
            </div>
            <div class="form-group">
                <label>Tanggal Presensi</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="form-group"><input type="text" id="instansi" placeholder="Asal Instansi/Sekolah" required></div>
            <div class="form-group"><input type="text" id="bidang" placeholder="Bidang/Kelas/Jurusan" required></div>
            <div class="form-group"><input type="text" id="nim" placeholder="NIK/NISN/NIM" required></div>
            <div class="form-group">
                <input type="text" id="daerah" placeholder="Asal Daerah (Kab/Kota)" required>
                <button type="button" class="btn-loc" onclick="detectLocation()">📍 Deteksi Lokasi Otomatis</button>
            </div>
            
            <button type="submit">Submit Presensi</button>
        </form>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbydNDAdo0VYQD6z9khP88yNmy2ogMuGFACuT_hRmIgh-TfdCcnoXEf-8-u4aEEDzSC3/exec";

        // Auto-set tanggal hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // Fetch list kode dari event_list.txt (pastikan file ini ada di root github)
        fetch('event_list.txt')
            .then(res => res.text())
            .then(text => {
                const codes = text.split('\n');
                const select = document.getElementById('kode');
                codes.forEach(c => { if(c.trim()) select.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`; });
            });

        // Load nama sesuai kode
        async function loadNames() {
            const code = document.getElementById('kode').value;
            const select = document.getElementById('nama');
            select.innerHTML = '<option>Loading...</option>';
            const res = await fetch(`${GAS_URL}?cmd=getNames&code=${code}`);
            const names = await res.json();
            select.innerHTML = '<option value="">Pilih Nama</option>';
            names.forEach(n => select.innerHTML += `<option value="${n}">${n}</option>`);
        }

        // Fungsi Deteksi Lokasi
        function detectLocation() {
            const input = document.getElementById('daerah');
            input.value = "Mendeteksi...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                        const data = await res.json();
                        input.value = `${data.address.city || data.address.town || data.address.county}, ${data.address.state}`;
                    } catch { input.value = "Gagal mendapatkan nama daerah"; }
                }, () => { input.value = "Izin lokasi ditolak"; });
            } else { alert("Browser tidak mendukung geolokasi"); }
        }

        document.getElementById('absenForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Mengirim...";
            
            const data = {
                kode: document.getElementById('kode').value,
                nama: document.getElementById('nama').value,
                tanggal: document.getElementById('tanggal').value,
                instansi: document.getElementById('instansi').value,
                bidang: document.getElementById('bidang').value,
                nim: document.getElementById('nim').value,
                daerah: document.getElementById('daerah').value
            };
            
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("Presensi berhasil dicatat!");
            btn.innerText = "Submit Presensi";
        };
    </script>
</body>
</html>
